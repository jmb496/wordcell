# WordCell v1 epics in build order (spine Proposed epics). Epics 2–7 are added as each is specced.

[[epic]]
id = 1
slug = "epic-scaffold-ci-deploy"
title = "Scaffold hardening, CI and deploy"
covers = []

[[epic]]
id = 2
slug = "epic-rules-engine"
title = "Rules engine"
covers = []
after = [{ epic = 1, needs = "the AD-1 layer checks, test:all gate and D1 placeholder feed" }]

[[epic]]
id = 3
slug = "epic-app-shell"
title = "App shell services"
covers = []
after = [{ epic = 2, needs = "the AD-2 engine surface (createSession, apply, accrue, view, parse/serialize, history functions), the command table, the valid and rejecting fixtures, and the R-02 golden deal test" }]

[[epic]]
id = 4
slug = "epic-board-and-gestures"
title = "Board and gestures"
covers = []
after = [{ epic = 3, needs = "the game store (dispatch, newGame, registerBeforeHide, halt), the overlays core and nav adapter, the dictionary showBanner state, motion.ts and text.ts, the test hook, touch/lifecycle/storage-spy helpers, the valid fixtures and the shared Playwright config" }]

[[epic]]
id = 5
slug = "epic-tray-and-place"
title = "Tray and Place"
covers = []
after = [{ epic = 4, needs = "the layout definition and geometry with trayLayout/trayOrder/trayGrowth and the gate (src/ui/layout, src/ui/gestures/gate.ts), the pointer controller with classify, intent, pickTarget and drop-target registration and its cancel()/act() wiring (src/ui/gestures, src/ui/act.ts), the slot-wrapper card with AD-14 live/mirror identity, the Board rendering every GameView state with the static tray (F2) and the Composing column gestures (F17), the overlays store, motion.ts durations, text.ts, the touchDrag/touchHold helpers, the Composing/Place fixtures and the board screenshot baselines" }]

[[epic]]
id = 6
slug = "epic-game-surfaces-and-keyboard"
title = "Game surfaces and keyboard"
covers = []
after = [{ epic = 5, needs = "the working tray and Place screen, FLIP and fly-to-cell, the winning-animation guard (src/ui/motion.ts, epic 5 F8), the overlays store with tile selection, text.ts, act(), the controller's cancel(), and the board screenshot baselines" }]
