[[entry]]
id = 12
type = "story"
title = "Winning guard: the end-sheet half"
description = "Finishes the AD-14 guard: the pending end-sheet open is cancelled by Undo (button, `Z` and Ctrl/Cmd+Z), so the animation completes, it undoes, and the sheet does not open; the guard recognises the Undo key aliases (keydown/keyup and repeats, only while Undo is enabled) beside the target match, Ctrl/Cmd+Shift+Z (Redo) is consumed like any other input; every other input in the window completes the animation and is consumed, then the sheet opens (outcome table in build-notes.md); the deferred open waits for whatever animations are in flight and fires at max(animation settled, 300 ms after the guard is installed), so Undo cancels the open and every other input is consumed for the whole guard window at every speed (EXPERIENCE.md Motion, epic 5 F8, F23); a Redo win behaves like a Confirm win; the menu button case. `inUndo` is already typeof-free."
