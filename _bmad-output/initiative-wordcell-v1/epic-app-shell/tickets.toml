description = "Tracer bullet: fixes B6 (addFreeLetter with index: undefined appends like an absent index, proved by a named test right after the AD-2 TABLE since the TABLE holds only no-op and throw rows; review-log open major 2), lands the B7 test gaps (an R-38-named structural-throw case, the four review-loop/2-12-build.md test minors, accrue between a finish and its un-finish, a regeneration test rebuilding the nine valid session fixtures from scripted accrue/apply, and a compiler-API AD-2 export-exactness test in src/architecture.test.ts), removes deal and Card from src/engine/index.ts, and feeds main.ts and App.svelte from a first game.svelte.ts cut that boots active with createSession(1) (E7, transitional, keeps the Seed line) and derives view."
verify = "npm run test:all is green, the R-02 golden deal literals are byte-identical, the export-exactness test fails when a scratch `export type { Start }` is added to index.ts, and the smoke spec still finds 52 live cards on the seed-1 board rendered from view."
covers = ["CAP-1"]
after = ["2.13"]
hitl = false
