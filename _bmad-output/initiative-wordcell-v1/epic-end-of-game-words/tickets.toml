# Epic 10 — End-of-game word list and win celebration. Table order is the build order.
# Requirement source: the epic spec (SPEC.md); `covers` cites its CAP ids. Rule-to-test map: rule-coverage.md.
# Lane A (list): entries 1, 2. Lane B (celebration): entries 3, 4, 5, 6, 7, 8, which share src/ui/celebration/, overlays.svelte.ts, end-sheet.ts, main.ts and test-hook.ts, so they run in sequence. Entries 3 and 4 can run beside entry 2; entry 5 waits for entry 2 because both change end-sheet tests and the end-sheet screenshot baselines. Entries 5–8 also use entry 1's fixture.
# The win route in Playwright: the won-words fixture plus one Undo is the Place phase whose Confirm wins (e2e/win-guard.spec.ts); a Redo from there wins again.
# npm run test:screens runs in the Playwright container for entries 2, 6 (first visible motion), 7, 9 and 10; the other entries run test:all.

[[entry]]
id = 1
type = "story"
title = "Engine word list and its fixture"
description = "Adds `wordList` and the exported `WordListEntry` type to `GameView`, built from the replay pass (whose internal return widens to carry each move's cards and cell): one entry per committed move with spelling, letter count, cards in word order and placement cell, ordered by letter count descending then spelling ascending, absent while playing; amends the AD-2 export list and the `expectTypeOf` pins; and adds `fixtures/session-won-words.json`, a valid won Session with a duplicate word, a letter-count tie, one long word and one card shared by two words (a WordCell top card reused as a free letter, R-41) (committed words are trusted by the parser, R-37, so a partition found by search is enough; real words preferred for the device read), registered in the fixture name list of `src/architecture-ad2-ad12-ad17.test.ts` (whose count wording is corrected) and in the `ValidName` union, `VALID`, `PROPERTIES` and `REBUILDS` of `src/engine/serialize.test.ts` (the rebuild is a scripted drop/validate/confirm sequence with inline dictionaries, as `winSeed` does), with the long word at least 10 letters, seeded only through `seedStorage`; no Session or history shape changes."
verify = "The engine unit tests named R-86 pass for order, ties, duplicates, QU, empty, a reused card, draft exclusion and Undo of the finish, `src/architecture-ad2-ad12-ad17.test.ts` and `src/engine/index.test.ts` list `WordListEntry`, `wordList` is absent while playing and present for won and gaveUp, the new fixture is registered in those three places, parses, rebuilds byte for byte and yields the expected list (including the shared `CardId` in two entries), and the existing serialize and fixture tests stay green."
covers = ["CAP-1"]
after = []
hitl = false
risk = "low"
unknown = "Finding a seed and move partition that gives a duplicate, a tie, a long word and a shared card is a search; real words are best-effort."
interface = "view(session, lang).wordList?: readonly WordListEntry[]; WordListEntry { spelling, letterCount, cards, cell }; fixtures/session-won-words.json (Undo then Confirm is the Playwright win route)."
tests = "R-86 rows of rule-coverage.md (E); architecture tests; fixture registration and rebuild tests."
owns = "The word list derivation and the shared won-with-words fixture."
consumers = "Entry 2 (EndSheet.svelte), entry 3 (the celebration), entries 5–8 (Playwright)."
references = ["architecture — ARCHITECTURE-SPINE.md AD-2, AD-3, AD-6", "rules — docs/game-flow-spec.md R-86, Q-47", "code — src/engine/view.ts, src/engine/replay.ts, src/engine/index.ts, fixtures/, e2e/helpers/seed.ts"]

