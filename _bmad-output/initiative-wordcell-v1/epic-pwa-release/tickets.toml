# Epic 7 — PWA and release. Table order is the build order.
# Requirement source: the epic spec (SPEC.md); `covers` cites its CAP ids. Rule-to-test map: rule-coverage.md; deferred device checks: device-checks.md; release evidence: release-checklist.md; the how: build-notes.md.
# One lane through src/main.ts, src/shell/sw.ts, the worker-state module, src/shell/test-hook.ts and e2e/pwa/; entries 2 and 4 can run beside each other after entry 1, entry 9 (scripts/device-preview.mjs, docs/device-testing.md) beside anything after entry 1.
# Order of release work: entry 11 → the epic retrospective → the owner merges and pushes → entry 12 (the owner's post-merge release step). Agents never merge or push.
# npm run test:screens runs in the Playwright container for entries 10 and 11 (no look change is expected before them); the other entries run test:all.

