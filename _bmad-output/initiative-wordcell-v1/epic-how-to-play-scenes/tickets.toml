# Epic 8 — How to play with animated scenes. Table order is the build order (HP-1 to HP-7); scene content is JSON in fixtures/ replayed by an engine test (AD-1).
# Requirement source: the epic file's Requirements. One lane through src/ui/HowToPlayPanel.svelte, a new scene player, text.ts and e2e.
# Every UI entry's check includes npm run test:screens in the Playwright container (epic 5 retro L3).

[[entry]]
id = 1
type = "story"
title = "Scene player, first scene and engine replay harness"
description = "Tracer bullet: a scene format (steps grab, move, drop, tap with a target and a time) whose game content (moves, words, scores) is JSON under fixtures/, a player that animates it on static Card components with a pointer ghost through WAAPI with motion.ts durations, loops with a rest between runs, pauses and restarts on a tap with a small pause/play icon, stops when the panel is closed or hidden and steps through frames under reduced motion; wires it above the text sections of the How to play panel with scene 1 (press E, lift E D K A, drop on column 3, HP-3a); adds the engine test under src/engine/ that replays every scene fixture through the real engine (legal moves, dictionary words, stated scores, rejected cases against the command TABLE); all scene text in text.ts, each scene a figure with a text description and aria-hidden animation."
verify = "npm run test:all and npm run test:screens are green with a Playwright android test that plays, pauses and restarts scene 1, a reduced-motion test that steps through its frames, a test that a closed panel runs no animation, and an engine test that fails when the fixture is changed to an illegal move."
covers = ["HP-1", "HP-2", "HP-5", "HP-6"]
after = []
hitl = false
risk = "medium"
unknown = "Largest entry: player, fixture format and replay harness in one session; if the plan exceeds one session, split the harness into a following entry. Also whether a scene needs a duration no existing motion kind gives."
plan_checkpoint = true
done_checkpoint = true
interface = "new src/ui/scenes/ (player, script types, one script file per scene); fixtures/how-to-play-*.json; src/engine/ scene replay test; HowToPlayPanel.svelte gains a scene slot; text.ts howTo gains scene strings."
tests = "Engine replay of every fixture (U, src/engine); play, pause, restart (P6 android); reduced-motion step-through (P6); closed panel animates nothing (U or P6)."
owns = "The scene player, the fixture format and the engine replay harness."
consumers = "HowToPlayPanel.svelte and text.ts howTo are shared with the existing sections (6.9); list the how-to-play specs and the panel screenshot baselines."
references = ["rules — docs/game-flow-spec.md, R-10, R-20, R-23, §8", "code — src/ui/HowToPlayPanel.svelte, src/ui/motion.ts, src/ui/Card.svelte, src/engine/commands.test.ts TABLE", "constraint — ARCHITECTURE-SPINE.md#ad-1 (UI imports engine types only; engine tests may import fixtures/*.json)"]

