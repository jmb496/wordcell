type = "story"
title = "Composing, Place and Game-over column behaviour"
description = "In Composing a tap on a destination-column card dispatches tapDestinationCard iff column.kIfTapped maps it to a number, and a drag started on one does not move it and dispatches the same once at pointerup for the press card (a cancelled press dispatches nothing); taps and drags on every other column, S ghosts and ghost mirrors included, and on non-card parts of any column do nothing; in Place and Game over every column tap and drag does nothing; desktop shows the 1 px outline of the D a click would set (top of D: k − 1; none at k = 1) and no hover outline or grab cursor on inert cards; plus the held destination-card press in Composing with hidePage giving no tapDestinationCard."
verify = "npm run test:all and npm run test:screens are green (baselines regenerated in the container only where the four fixture renders change), and Playwright on android shows a destination-card tap and a destination-card drag each setting k saved before the next action, the top of D giving k − 1 and a no-op at k = 1, every other column and ghost tap or drag leaving the Session reference unchanged on session-composing, every column tap and drag inert on session-place, session-gave-up and session-won, Undo from Composing returning the tail and a new drag then working, a held destination-card press plus hidePage dispatching nothing, and on desktop the k hover preview and no hover outline in Place and Game over."
covers = ["CAP-8"]
after = [9]
hitl = false
risk = "medium"
unknown = "None."
interface = "Controller phase gating for column presses from GameView flags (kIfTapped, canPickUp, canDropOn); Column.svelte desktop k-preview class."
tests = "R-31 tap sets k via kIfTapped (P4 supp.); R-39 (UI) other columns inert in Composing; R-39 (UI) a drag on a destination card is a tap; R-39 (UI) Undo to change source or destination; R-39 (UI) columns inert in Place; R-75 no select or drop while status ≠ playing (P4 supp.); R-73 (UI) a k change from the column saved before the next action; AD-9/AD-17 held destination-card press plus hidePage → no tapDestinationCard."
owns = "The column side of Composing (F17) and phase inertness of columns."
references = ["spec — _bmad-output/specs/spec-epic-4-board/build-notes.md, CAP-8"]

[[entry]]
id = 11
type = "story"
title = "WordCell peek and sticky view"
description = "Adds WordCellView.svelte and its controller paths (R-65, Q-21, F14): a long-press ≥ 400 ms on a non-empty WordCell opens the peek through overlays.openPeek (no entry), closing on release unless the rendered sheet's scroll area overflows (scrollHeight > clientHeight), when peekToSticky pushes one entry above any kept selection; a tap in Idle with nothing selected or in Game over opens the sticky view via openView (one entry) titled WordCell n · m cards / WordCell n · 1 card from text.ts (F27), listing CellView.cards bottom first with top on the last as mirrors (a used cell's top a normal-card mirror); the sheet and its mirrors pan-y, user-select: none and -webkit-touch-callout: none with overscroll-behavior contain, a touch-action none scrim, the controller classifying sheet and scrim presses (tap closes and swallows that gesture's trailing click until it, the next pointerdown or a 300 ms expiry; drag does nothing), back closing it; Composing and Place WordCell taps and drags dispatch nothing and open no view while the peek works; an empty WordCell opens nothing; a WordCell drag never lifts a tail (R-12); and the scripted valid fixture session-gave-up-after-commit.json (as session-idle-empty-column with gaveUp true) added to src/engine/serialize.test.ts (VALID and REBUILDS) and src/architecture.test.ts's valid session-fixture list (count ten → eleven)."
verify = "npm run test:all and npm run test:screens are green (baselines regenerated in the container only where the four fixture renders change) with UI Vitest AD-12 trailing-click cases, and Playwright on android shows the long-press peek on session-idle-empty-column (also with a tail selected, selection kept), on session-place-free-letter-redo-tail and after one Undo into Composing, and on session-won; peek turned sticky on session-won's deepest cell at a short viewport; tap → sticky view in Idle and on session-won and session-gave-up-after-commit with the F27 title; a swipe in an overflowing view scrolling it open; a 20 px scrim drag keeping it; a scrim tap over the enabled Undo closing it without undoing; sticky-view reload then back leaving the app; and every view leaving current().session and storage unchanged."
covers = ["CAP-9"]
after = [10]
hitl = false
risk = "high"
unknown = "The touch pointerup → click order on Chromium (unverified, gated by the scrim-over-Undo case); whether session-won's deepest cell overflows at a usable short viewport (else the ticket scripts one more valid fixture, SPEC Assumptions)."
interface = "New src/ui/WordCellView.svelte; text.ts gains the view title strings (F27); controller long-press, sheet and scrim paths; new fixtures/session-gave-up-after-commit.json."
tests = "R-65 (UI) every card of any WordCell viewable at any time (peek, sticky, overflow, scrim cases); R-65 (UI) viewing changes nothing; R-65 (UI) the view does not enter the move history; Q-21 long-press under R-65; R-12 a WordCell drag never lifts a tail (P4 supp.); R-33 a Composing WordCell tap is a no-op in epic 4 (P4 supp.); R-39 (UI) Place WordCells inert except viewing (P4 part); R-75 viewing available in Game over (P4 supp.); AD-13 sticky-view reload then back leaves the app; AD-13 peek/sticky entry counts (P4); AD-12 trailing click swallowed then a later click reaches its handler, disarm by pointerdown or expiry (S)."
owns = "WordCellView.svelte, the view title strings, session-gave-up-after-commit.json and the scrim click swallower."
references = ["spec — _bmad-output/specs/spec-epic-4-board/build-notes.md, CAP-9"]

