<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/src/ui/assets/wordcell-serif.woff2">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#15171B" />
    <title>WordCell</title>
    <script>
      // AD-16 pre-paint: set the stored theme on the root before first paint (read-only; prefs.svelte.ts stays the only writer and validator, Q-45).
      try {
        var t = JSON.parse(localStorage.getItem("wordcell:prefs")).theme;
        if (typeof t === "string" && /^[a-z]+$/.test(t)) document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
