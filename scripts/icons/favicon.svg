  <g transform="rotate(-8 32 32)">
    <rect x="13" y="6" width="38" height="52" rx="5" ry="5" fill="#23262C" stroke="#6A707C" stroke-width="2"/>
    <polyline points="19,17 25,40 32,25 39,40 45,17" fill="none" stroke="#F3EEE4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="22" y1="49" x2="29" y2="49" fill="none" stroke="#3DBDB5" stroke-width="3" stroke-linecap="round"/>
    <line x1="35" y1="49" x2="42" y2="49" fill="none" stroke="#EF7A3D" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
